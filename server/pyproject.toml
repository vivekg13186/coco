[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coco-server"
version = "0.1.0"
description = "Coco workflow engine: REST API, SQLite store, run worker"
requires-python = ">=3.11"
dependencies = ["coco-core", "fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
coco-server = "coco_server.main:main"

[tool.setuptools.packages.find]
include = ["coco_server*"]

[tool.setuptools.package-data]
coco_server = ["ui/*", "ui/**/*"]  # the built web UI (npm run build in ui/ refreshes it)

[tool.pytest.ini_options]
testpaths = ["tests"]
